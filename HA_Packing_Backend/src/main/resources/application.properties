spring.application.name=HA_Packing_Backend
# Server Configuration
server.port=8080

# Database Configuration for MSSQL
spring.datasource.url=jdbc:sqlserver://172.16.32.13;encrypt=true;trustServerCertificate=true;databaseName=TNT_SONA
spring.datasource.username=sa
spring.datasource.password=office@123
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto= none
spring.jpa.show-sql=true

# Spring Scheduling Configuration
spring.scheduling.enabled=true